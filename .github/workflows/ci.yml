name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Does it build, and does the binary start, on all three platforms? The native assets are the
  # thing worth checking here: SkiaSharp and GLFW are unmanaged libraries picked per platform, and
  # a missing one builds perfectly and then fails at startup.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build -c Release --no-restore

      # --help parses its arguments and returns before any window exists, so this runs anywhere,
      # including on a runner with no display at all.
      #
      # --no-launch-profile because otherwise `dotnet run` silently applies the first profile in
      # launchSettings.json and prepends its arguments to these. Today that profile passes none;
      # adding one above it would change what CI runs without touching this file.
      - name: Start the binary
        run: dotnet run -c Release --no-build --no-launch-profile -- --help

  # Actually render something. A build that compiles and a build that draws are different claims,
  # and the second one is what this program is for.
  #
  # There is no GPU on a runner, so this is Mesa's software OpenGL under a virtual X server, which is
  # slow but complete — llvmpipe implements far past the 3.3 this needs for the display surface. The
  # kernel is pinned to the CPU because the GPU kernel wants a 4.0 context and fp64, which is asking a
  # lot of a software rasteriser.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Mesa alone is not enough. GLFW is a native library that links against the X11 client
      # libraries, and if any of them is missing it simply fails to load — which surfaces as
      # Silk.NET reporting "GlfwPlatform - not applicable", a message that sounds like a missing
      # display and is actually a missing .so.
      - name: Install a software OpenGL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1 libglx-mesa0 libgl1-mesa-dri \
            libx11-6 libxrandr2 libxinerama1 libxcursor1 libxi6 \
            libxext6 libxfixes3 libxrender1 libxkbcommon0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libfontconfig1

      - run: dotnet build -c Release

      # A display for the whole job rather than one wrapped around each command, so that what the
      # renderer sees is visible here too. Silk.NET reports a native library that will not load and a
      # GLFW that will not initialise with the same "not applicable", and throws the reason away, so
      # both are checked here instead: the loader's view of the library, and whether anything can
      # actually get a GL context on this display.
      - name: Start a display
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 3

      - name: Check GLFW can load and GL can run
        run: |
          so=$(find . -name 'libglfw*so*' | head -1)
          echo "glfw: $so"
          ldd "$so" 2>/dev/null | grep -i "not found" || echo "  (no missing libraries)"
          echo "DISPLAY=$DISPLAY"
          glxinfo -B 2>&1 | head -8 || echo "  (glxinfo failed — no GL on this display)"

      # One from each of the three renderers, since they share almost no code: a sampled field, a
      # drawn construction, and the wide-arithmetic path that only exists below 1e-12.
      - name: Render one of each kind
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -e
          run() {
            xvfb-run -a --server-args="-screen 0 640x480x24" \
              dotnet run -c Release --no-build --no-launch-profile -- \
                --explore --no-menu --no-hud --renderer cpu \
                --duration 6 --size 320x240 "$@"
          }
          run --fractal mandelbrot --snapshot field.png
          run --fractal koch       --snapshot drawn.png
          # This centre is not a round number and cannot be: at 1e13 the window is 1.3e-13 across, so
          # a view has to be aimed at somewhere the set actually has structure or the frame comes out
          # a flat wash and fails the size check for reasons that have nothing to do with the code.
          # It came from running the automatic descent to 1e13 and keeping where it stopped.
          run --fractal burning \
              --center -0.9109926047070786381001481,0.632270549363135982778393848 \
              --zoom 1e13 --snapshot wide.png

      # A window that never drew anything still writes a file, so check the size: an all-black 320x240
      # PNG is under 2 kB and any of these should be several times that.
      - name: Check the frames are not blank
        run: |
          set -e
          for f in field.png drawn.png wide.png; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            [ "$size" -gt 4000 ] || { echo "::error::$f looks blank ($size bytes)"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-frames
          path: '*.png'
          if-no-files-found: warn
